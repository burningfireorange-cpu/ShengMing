<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>神明彈珠台 Q版試玩</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chiron+GoRound+TC:wght@500;700;900&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Huninn&display=swap">
<style>
/* Q-pixel battle prototype · one dark night-market world (single theme on purpose)
   layers: art (low-res, pixelated) · ui (low-res, own pixel size) · smooth text (full res) */
:root{
  --ink:#2b1630; --night:#120a20; --lacquer:#5a1630; --wood:#a8642e; --woodD:#5c3218; --gold:#ffd23f; --goldD:#c98a12;
  --paper:#fff1d6; --red:#ff3b4e; --jade:#2ec4a6; --text:#fff3dc; --muted:#c9b3d6;
  --round:"Chiron GoRound TC","Huninn","PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
[hidden]{display:none!important}
body{margin:0;background:var(--night);color:var(--text);font-family:var(--round);overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#app{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);touch-action:none}
#app>canvas{position:absolute;left:0;top:0;width:100%;height:100%;display:block}
#art,#ui{image-rendering:pixelated;image-rendering:crisp-edges}
#scan{position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(rgba(0,0,0,.18) 0 1px,transparent 1px 3px);mix-blend-mode:multiply}
#bSet{position:absolute;right:1.2%;top:.55%;width:8.5%;aspect-ratio:1;border:0;background:transparent;cursor:pointer;z-index:5}
#bSet:focus-visible{outline:3px solid var(--jade);outline-offset:2px}
/* pixel panels */
.pnl{position:absolute;inset:0;z-index:20;display:flex;align-items:flex-end;justify-content:center;background:rgba(10,4,18,.62)}
.sheet{width:100%;max-height:88%;overflow:auto;background:#2a1030;border-top:4px solid var(--ink);box-shadow:inset 0 3px 0 #5a3070,0 -4px 0 var(--gold);padding:14px 16px calc(16px + env(safe-area-inset-bottom,0px));box-sizing:border-box}
.sheet h3{margin:0 0 4px;font-size:20px;font-weight:900;color:var(--gold);letter-spacing:.04em;text-shadow:2px 2px 0 var(--ink)}
.sheet .sub{margin:0 0 12px;font-size:12.5px;color:var(--muted);line-height:1.45}
.row{display:grid;grid-template-columns:minmax(0,1fr);gap:6px;padding:9px 0;border-top:2px dashed rgba(255,210,63,.18)}
.row b{font-size:14px;font-weight:900}.row b small{font-weight:700;color:var(--muted);font-size:11.5px;margin-left:6px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{appearance:none;font:inherit;font-weight:900;font-size:14px;color:#fff1cf;background:#3a1a4a;border:0;padding:8px 12px;cursor:pointer;box-shadow:0 0 0 2px var(--ink),inset 0 2px 0 #6a4a8a,inset 0 -3px 0 #1e0c2a;border-radius:2px}
.seg button.on{background:var(--gold);color:#4a1a08;box-shadow:0 0 0 2px var(--ink),inset 0 2px 0 #fff2a0,inset 0 -3px 0 var(--goldD)}
.seg button:focus-visible,.btns button:focus-visible{outline:3px solid var(--jade);outline-offset:2px}
.btns{display:flex;gap:10px;margin-top:12px}
.btns button{flex:1;appearance:none;font:inherit;font-weight:900;font-size:16px;padding:12px;border:0;cursor:pointer;color:#fff;background:#d7263d;box-shadow:0 0 0 2px var(--ink),inset 0 3px 0 #ff8a96,inset 0 -4px 0 #8f0e1f;border-radius:2px}
.btns button.alt{background:var(--gold);color:#4a1a08;box-shadow:0 0 0 2px var(--ink),inset 0 3px 0 #fff2a0,inset 0 -4px 0 var(--goldD)}
/* detail card */
#pnlCard .sheet{max-width:440px;border:4px solid var(--ink);box-shadow:inset 0 0 0 3px #c98a4a,0 6px 0 rgba(0,0,0,.4);background:var(--paper);color:#4a1e10;margin:0 12px 20px;border-radius:2px}
#pnlCard h3{color:#a8121e;text-shadow:none;font-size:22px}
#cdTop{display:flex;gap:12px;align-items:center;margin-bottom:8px}
#cdIcon{width:64px;height:64px;flex:none;image-rendering:pixelated}
#cdMeta{font-size:13px;font-weight:700;color:#8a5a3a;line-height:1.5}
#cdDesc{font-size:15px;line-height:1.55;margin:6px 0 10px}
.kw{display:flex;gap:8px;align-items:flex-start;font-size:13px;line-height:1.45;padding:6px 8px;background:#f3dcb4;margin-top:6px;border-radius:2px}
.kw b{flex:none;color:#fff;background:#a8121e;padding:1px 6px;font-size:12px;border-radius:2px}
.hint{font-size:11.5px;color:#8a6a5a;margin-top:10px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app">
  <canvas id="art"></canvas><canvas id="ui"></canvas><canvas id="sm"></canvas><div id="scan" hidden></div>
  <button id="bSet" aria-label="設定 Einstellungen"></button>
  <div class="pnl" id="pnlSet" hidden><div class="sheet" role="dialog" aria-labelledby="setTitle">
    <h3 id="setTitle">畫面設定 <small style="font-size:12px;color:var(--muted)">· Darstellung vergleichen</small></h3>
    <p class="sub">每項都能即時切換，邊玩邊比較。<br>Jede Einstellung wirkt sofort – einfach umschalten und weiterspielen.</p>
    <div id="setRows"></div>
    <div class="btns"><button class="alt" id="bRestart">重新開始 · Neu starten</button><button id="bSetClose">繼續玩 · Weiter</button></div>
  </div></div>
  <div class="pnl" id="pnlCard" hidden><div class="sheet" role="dialog" aria-labelledby="cdName">
    <div id="cdTop"><canvas id="cdIcon" width="44" height="44"></canvas><div><h3 id="cdName"></h3><div id="cdMeta"></div></div></div>
    <div id="cdDesc"></div><div id="cdKw"></div>
    <div class="hint">按住卡片或點兩下看說明 · Karte gedrückt halten oder doppelt tippen für Details</div>
    <div class="btns"><button id="bCdClose">知道了 · OK</button></div>
  </div></div>
</div>

<script>

function applySet() { document.getElementById('scan').hidden = !SET.scan; CA.style.filter = `saturate(${SET.sat})`; CU.style.filter = `saturate(${Math.min(1.25, SET.sat)})`; layout(); }

}
function whiteOf(c) { const o = document.createElement('canvas'); o.width = c.width; o.height = c.height; const g = o.getContext('2d'); g.drawImage(c, 0, 0); g.globalCompositeOperation = 'source-atop'; g.fillStyle = '#fff'; g.fillRect(0, 0, o.width, o.height); return o; }

let SMQ = []; // smooth texts queued for this frame
function txt(role, s, x, y, col, o = {}) {

}

  shakeT = Math.max(0, shakeT - dt); if (!shakeT) shakeA = 0;
  B.heroFlash = Math.max(0, (B.heroFlash || 0) - dt * 3); B.comboT = Math.max(0, B.comboT - dt);
  for (const e of B.enemies) { e.flash = Math.max(0, e.flash - dt * 3); e.lunge *= Math.pow(0.02, dt); if (e.dead) e.deadT = (e.deadT || 0) + dt; }
  for (const f of B.furn) { f.flash = Math.max(0, (f.flash || 0) - dt * 4); if (f.type === 'mill') { f.spin = Math.max(1.5, (f.spin || 1.5) - dt * 3); f.a += f.spin * dt; } }

  B.balls = B.balls.filter(o => !o.dead);
  for (const p of B.projs) { p.t += dt * 2.6; if (p.t >= 1 && !p.done) { p.done = 1; landHit(p); } } B.projs = B.projs.filter(p => !p.done);

}

  if (inRect(p, 6, HAND_Y + 64, 56, 40)) { endTurn(); ptr = null; return; }
  for (let i = 0; i < 7; i++) { const x = 6 + i * 30 + (i >= 5 ? 10 : 0); if (inRect(p, x, 40, 26, 26)) { const it = i < 3 ? TALIS[i] : i === 5 ? CONS[0] : null; if (it) openInfo(it); ptr = null; return; } }
  for (let i = 0; i < B.enemies.length; i++) { const en = B.enemies[i]; if (!en.dead && inRect(p, en.x - 28, GROUND - en.d.h - 40, 56, en.d.h + 44)) { B.target = i; sfx('click'); ptr = null; return; } }
  if (p.y > BD.t - 20 && p.y < BD.b && B.phase === 'aim' && B.sel >= 0) { ptr.aim = true; B.aim = p; }
});
app.addEventListener('pointermove', e => { if (!ptr || ptr.id !== e.pointerId) return; const p = toWorld(e); if (ptr.card != null && Math.hypot(p.x - ptr.start.x, p.y - ptr.start.y) > 8) { clearTimeout(lpT); } if (ptr.aim) B.aim = p; });
app.addEventListener('pointerup', e => {
  if (!ptr || ptr.id !== e.pointerId) return; clearTimeout(lpT); const p = toWorld(e);
  if (ptr.card != null) { const i = ptr.card, now = performance.now(); if (lastTap.i === i && now - lastTap.t < 320) { openCard(B.hand[i]); lastTap = { i: -1, t: 0 }; } else { lastTap = { i, t: now }; if (B.phase === 'aim') { B.sel = i; sfx('click'); if (!canPlay(B.hand[i])) toastNo(); } } }
  else if (ptr.aim) { B.aim = p; fire(); }
  ptr = null;
});
app.addEventListener('pointercancel', () => { ptr = null; clearTimeout(lpT); if (B) B.aim = null; });
function openCard(h) { if (!h) return; const d = defOf(h), ty = TYPE[d.t]; paused = true; document.getElementById('cdName').textContent = d.zh + (d.up ? '+' : '');
  document.getElementById('cdMeta').innerHTML = `${ty[0] === '攻' ? '攻擊' : ty[0] === '守' ? '防守' : '技能'}・花費 ${d.cost} 香・每釘 ${d.shield ? '+' + d.shield + ' 護體' : '+' + d.pts + ' 力'}`;
  document.getElementById('cdDesc').textContent = d.desc; document.getElementById('cdKw').innerHTML = d.kw.map(k => `<div class="kw"><b>${KWD[k][0]}</b><span>${KWD[k][1]}</span></div>`).join('');
  drawIcon(d.g, d.col);
  document.getElementById('pnlCard').hidden = false; }
function openInfo(it) { paused = true; document.getElementById('cdName').textContent = it.zh; document.getElementById('cdMeta').textContent = it.g === '香' ? '消耗品' : '法器・放在法器台上，整場戰鬥有效'; document.getElementById('cdDesc').textContent = it.desc; document.getElementById('cdKw').innerHTML = '';
  drawIcon(it.g, it.col);
  document.getElementById('pnlCard').hidden = false; }
function drawIcon(gl, col) { const c = document.getElementById('cdIcon'), g = c.getContext('2d'); g.clearRect(0, 0, 44, 44); for (let y = 0; y < 44; y++) for (let x = 0; x < 44; x++) { const d = Math.hypot(x - 21.5, y - 21.5); if (d < 21) { g.fillStyle = d > 19 ? OL : d > 16 ? '#ffd23f' : col; g.fillRect(x, y, 1, 1); } } const m = pixMask(gl, 24, true); g.drawImage(tinted(m, '#3a0a10', `m|${gl}|24|true`), 22 - (m.width >> 1), 22 - (m.height >> 1)); }
document.getElementById('bCdClose').onclick = () => { document.getElementById('pnlCard').hidden = true; paused = false; };
window.addEventListener('resize', () => applySet());

/* ====================================================== boot ====================================================== */
(async () => {
  try { await Promise.race([Promise.all([document.fonts.load(`900 16px ${FONT}`), document.fonts.load(`700 16px ${FONT}`)]), new Promise(r => setTimeout(r, 1500))]); } catch (e) {}
  applySet(); newBattle(); requestAnimationFrame(loop);
  window.__ready = 1;
})();
</script>
